title: Apurv Chudasama — AI Engineer, Voice & Agentic AI
description: AI Engineer in Ahmedabad building real-time voice agents and agentic systems. LangGraph, RAG, PyTorch, computer vision.
url: "https://apurv090405.github.io"
baseurl: "/Apurv-Chudasama"

# Blog Settings
future: true
show_drafts: true

# Node tooling used only by the Vercel prebuild — keep it out of the Jekyll build.
exclude:
  - node_modules
  - scripts
  - package.json
  - package-lock.json
  - vercel.json
  - blog

# Collections
collections:
  posts:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "blog"
      permalink: "/blog/:year/:month/:day/:title/"
